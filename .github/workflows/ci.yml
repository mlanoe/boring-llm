name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install boring
        run: cargo install --git https://github.com/mlanoe/boring

      - name: Run tests
        shell: bash
        run: |
          # The *_real.br programs need a real --target metal build, a GPU and
          # downloaded GGUF files (gitignored, absent in CI); GitHub's macOS
          # runners do not reliably expose a GPU, same limitation as
          # whisper-boring's CI. bench_linear_warp.br is a manual benchmark that
          # throws without a command-line argument, so it is not swept in.
          # Any test/*_real.br (compiled build, real weights) is skipped by name.
          for f in test/*.br; do
            case "$f" in
              *_real.br) continue ;;
              test/bench_linear_warp.br) continue ;;
            esac
            echo "=== $f ==="
            boring run "$f"
          done

      - name: Tool self-tests
        shell: bash
        run: |
          # stdlib only: the parsing and comparison logic of the llama.cpp
          # comparison tools (the tools themselves need llama-cpp-python and a
          # model, which CI does not have).
          python3 tools/bench_vs_llamacpp.py --selftest
          python3 tools/profile_decode_marginal.py --selftest
          python3 tools/accuracy_vs_llamacpp.py --selftest
          python3 tools/decode_vs_llamacpp.py --selftest
          python3 tools/fetch_models.py --selftest

      - name: Documentation is up to date
        if: runner.os == 'Linux'
        run: |
          # docs/*.html and README.html are generated from the Markdown files:
          # regenerating them must not change anything that is committed.
          python3 docs/build.py
          git diff --exit-code -- README.html docs
